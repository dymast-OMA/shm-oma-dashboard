<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SHM OMA Dashboard</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #5f6b7a;
      --line: #d6dbe3;
      --accent: #0b6bcb;
      --accent-2: #26845d;
      --warn: #ad5b00;
      --shadow: 0 1px 4px rgba(20, 30, 45, 0.08);
      font-family: Segoe UI, Roboto, Arial, sans-serif;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 18px 24px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0;
    }
    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    main {
      padding: 16px 24px 28px;
      display: grid;
      gap: 14px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 10px;
      align-items: end;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 6px;
      padding: 12px;
    }
    label {
      display: grid;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
      min-width: 0;
    }
    input, select, button {
      font: inherit;
      font-size: 14px;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 8px 9px;
      background: #fff;
      color: var(--text);
      min-width: 0;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      font-weight: 600;
    }
    button.secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--line);
      font-weight: 500;
    }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .checks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      align-items: center;
      min-height: 36px;
    }
    .checks label {
      display: inline-flex;
      grid-template: none;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: var(--text);
    }
    .checks input {
      padding: 0;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .stat .value {
      font-size: 20px;
      font-weight: 700;
    }
    .stat .label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }
    .chart-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      box-shadow: var(--shadow);
      min-height: 560px;
    }
    svg {
      width: 100%;
      height: 560px;
      display: block;
      cursor: default;
      user-select: none;
      touch-action: none;
    }
    svg.can-pan {
      cursor: grab;
    }
    svg.is-panning {
      cursor: grabbing;
    }
    .compact-dashboard .hide-rolling {
      display: none !important;
    }
    .compact-dashboard .toolbar {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .axis text {
      fill: var(--muted);
      font-size: 12px;
    }
    .axis line, .axis path {
      stroke: var(--line);
      shape-rendering: crispEdges;
    }
    .grid line {
      stroke: #e8ebf0;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin: 8px 4px 0;
      font-size: 13px;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .config {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      box-shadow: var(--shadow);
    }
    .config h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .config pre {
      margin: 0;
      white-space: pre-wrap;
      color: #2d3748;
      font-size: 12px;
      line-height: 1.4;
      max-height: 260px;
      overflow: auto;
    }
    .tooltip {
      position: fixed;
      pointer-events: none;
      background: #111827;
      color: white;
      padding: 8px 9px;
      font-size: 12px;
      border-radius: 5px;
      box-shadow: 0 8px 22px rgba(0,0,0,0.18);
      display: none;
      z-index: 5;
      max-width: 280px;
    }
    .empty {
      display: grid;
      place-items: center;
      height: 420px;
      color: var(--muted);
      font-size: 15px;
    }
    @media (max-width: 900px) {
      .toolbar, .stats {
        grid-template-columns: 1fr;
      }
      .span-2, .span-3, .span-4 {
        grid-column: span 1;
      }
      main, header {
        padding-left: 12px;
        padding-right: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>SHM OMA Dashboard</h1>
    <div class="sub">FDD/SSI modal results generated locally. Last update: <span id="generatedAt"></span></div>
  </header>
  <main>
    <section class="toolbar">
      <label class="span-2 hide-rolling">From<input id="fromDate" type="date"></label>
      <label class="span-2 hide-rolling">To<input id="toDate" type="date"></label>
      <label class="span-2 hide-rolling">Aggregation
        <select id="aggregation">
          <option value="hour">Hourly</option>
          <option value="day">Daily</option>
          <option value="month">Monthly</option>
        </select>
      </label>
      <label class="span-2">Method<div class="checks" id="methodChecks"></div></label>
      <label class="span-2">Modes<div class="checks" id="modeChecks"></div></label>
      <button id="applyBtn" class="span-1 hide-rolling">Apply</button>
      <button id="last7Btn" class="secondary span-1 hide-rolling">Week</button>
      <button id="last30Btn" class="secondary span-1 hide-rolling">Month</button>
      <button id="allBtn" class="secondary span-1 hide-rolling">All</button>
      <button id="zoomOutBtn" class="secondary span-1 hide-rolling" title="Zoom out on the time axis">Zoom -</button>
      <button id="zoomInBtn" class="secondary span-1 hide-rolling" title="Zoom in on the time axis">Zoom +</button>
      <button id="resetZoomBtn" class="secondary span-1 hide-rolling" title="Return to the selected range">Reset</button>
      <label class="span-2 hide-rolling">Auto-refresh
        <select id="refresh">
          <option value="0">Off</option>
          <option value="60">60 s</option>
          <option value="300">5 min</option>
          <option value="1800">30 min</option>
        </select>
      </label>
    </section>

    <section class="stats">
      <div class="stat"><div class="value" id="statPoints">0</div><div class="label">visible points</div></div>
      <div class="stat"><div class="value" id="statRange">-</div><div class="label">period</div></div>
      <div class="stat"><div class="value" id="statMethods">-</div><div class="label">methods</div></div>
      <div class="stat"><div class="value" id="statModes">-</div><div class="label">modes</div></div>
    </section>

    <section class="chart-wrap">
      <svg id="chart" role="img" aria-label="Frequency evolution over time"></svg>
      <div class="legend" id="legend"></div>
    </section>
</main>
  <div class="tooltip" id="tooltip"></div>

      const margin = {top: 24, right: 28, bottom: 56, left: 68};
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.innerHTML = "";
      els.legend.innerHTML = "";
      if (!data.length) {
        const foreign = document.createElementNS("http://www.w3.org/2000/svg", "foreignObject");
        foreign.setAttribute("x", 0);
        foreign.setAttribute("y", 0);
        foreign.setAttribute("width", width);
        foreign.setAttribute("height", height);
        foreign.innerHTML = `<div class="empty">No data for the current selection</div>`;
        svg.appendChild(foreign);
        chartState = null;
        svg.classList.remove("can-pan", "is-panning");
        return;
      }
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const xs = data.map(d => d.date.getTime());
      const baseRange = selectedTimeRange(xs);
      const range = activeTimeRange(baseRange);
      const xMin = range.xMin, xMax = range.xMax;
      chartState = {baseRange, currentRange: range, plotW};
      svg.classList.toggle("can-pan", canPan());
      const chartData = data.filter(d => {
        const t = d.date.getTime();
        return t >= xMin && t <= xMax;
      });
      const ySource = chartData.length ? chartData : data;
      const ys = ySource.map(d => d.frequency_hz);
      const yMinRaw = Math.min(...ys), yMaxRaw = Math.max(...ys);
      const yPad = Math.max((yMaxRaw - yMinRaw) * 0.08, 0.05);
      const yMin = yMinRaw - yPad, yMax = yMaxRaw + yPad;
      const sx = t => margin.left + (xMax === xMin ? plotW / 2 : (t - xMin) / (xMax - xMin) * plotW);
      const sy = y => margin.top + (yMax - y) / (yMax - yMin) * plotH;
      drawGrid(svg, margin, plotW, plotH, yMin, yMax, sy);
      drawAxes(svg, margin, width, height, xMin, xMax, yMin, yMax, sx, sy);
      const series = groupSeries(chartData);
      series.forEach((rows, name) => drawSeries(svg, rows, name, sx, sy));
      drawLegend(series);
    }
    function selectedTimeRange(xs) {
      const selectedFrom = els.fromDate.value ? new Date(els.fromDate.value + "T00:00:00").getTime() : null;
      const selectedTo = els.toDate.value ? new Date(els.toDate.value + "T23:59:59").getTime() : null;
      const dataMin = Math.min(...xs);
      const dataMax = Math.max(...xs);
      if (dashboardOptions().fit_data_range) {
        const span = Math.max(dataMax - dataMin, 1);
        const pad = span * Number(dashboardOptions().data_range_padding_ratio || 0);
        return {
          xMin: dataMin - pad,
          xMax: dataMax + pad
        };
      }
      return {
        xMin: selectedFrom == null ? dataMin : selectedFrom,
        xMax: selectedTo == null ? dataMax : selectedTo
      };
    }
    function activeTimeRange(baseRange) {
      if (!zoomRange) return baseRange;
      const baseSpan = Math.max(baseRange.xMax - baseRange.xMin, 1);
      const minSpan = minZoomSpanMs();
      let xMin = Math.max(baseRange.xMin, zoomRange.xMin);
      let xMax = Math.min(baseRange.xMax, zoomRange.xMax);
      if (xMax - xMin < minSpan || xMax <= xMin || xMax - xMin >= baseSpan) {
        zoomRange = null;
        return baseRange;
      }
      return {xMin, xMax};
    }
    function clearZoom() {
      zoomRange = null;
      panState = null;
      els.chart.classList.remove("can-pan", "is-panning");
    }
    function resetZoom() {
      clearZoom();
      render();
    }
    function zoomBy(factor) {
      const data = aggregate(filteredRecords());
      if (!data.length) return;
      const xs = data.map(d => d.date.getTime());
      const base = selectedTimeRange(xs);
      const current = activeTimeRange(base);
      const baseSpan = Math.max(base.xMax - base.xMin, 1);
      const minSpan = minZoomSpanMs();
      let span = Math.max((current.xMax - current.xMin) * factor, minSpan);
      if (span >= baseSpan) {
        resetZoom();
        return;
      }
      const center = (current.xMin + current.xMax) / 2;
      let xMin = center - span / 2;
      let xMax = center + span / 2;
      if (xMin < base.xMin) {
        xMax += base.xMin - xMin;
        xMin = base.xMin;
      }
      if (xMax > base.xMax) {
        xMin -= xMax - base.xMax;
        xMax = base.xMax;
      }
      zoomRange = {xMin: Math.max(base.xMin, xMin), xMax: Math.min(base.xMax, xMax)};
      render();
    }
    function canPan() {
      if (!chartState || !zoomRange) return false;
      const base = chartState.baseRange;
      const current = chartState.currentRange;
      return current.xMax - current.xMin < base.xMax - base.xMin;
    }
    function startPan(ev) {
      if (ev.button !== 0 || !canPan()) return;
      panState = {
        pointerId: ev.pointerId,
        startClientX: ev.clientX,
        startRange: {...chartState.currentRange}
      };
      els.chart.classList.add("is-panning");
      els.chart.setPointerCapture?.(ev.pointerId);
      hideTooltip();
      ev.preventDefault();
    }
    function movePan(ev) {
      if (!panState || !chartState) return;
      const dx = ev.clientX - panState.startClientX;
      const span = panState.startRange.xMax - panState.startRange.xMin;
      const deltaMs = -dx / Math.max(chartState.plotW, 1) * span;
      zoomRange = clampRange(
        panState.startRange.xMin + deltaMs,
        panState.startRange.xMax + deltaMs,
        chartState.baseRange
      );
      render();
      ev.preventDefault();
    }
    function endPan() {
      if (!panState) return;
      els.chart.releasePointerCapture?.(panState.pointerId);
      panState = null;
      els.chart.classList.remove("is-panning");
    }
    function clampRange(xMin, xMax, base) {
      const span = xMax - xMin;
      if (xMin < base.xMin) {
        xMax += base.xMin - xMin;
        xMin = base.xMin;
      }
      if (xMax > base.xMax) {
        xMin -= xMax - base.xMax;
        xMax = base.xMax;
      }
      return {
        xMin: Math.max(base.xMin, xMin),
        xMax: Math.min(base.xMax, xMax)
      };
    }
    function minZoomSpanMs() {
      const agg = els.aggregation.value;
      if (agg === "month") return 31 * 86400000;
      if (agg === "day") return 86400000;
      return 3600000;
    }
    function groupSeries(data) {
      const map = new Map();
      data.forEach(d => {
        const key = `${d.method} Mode ${d.mode_index}`;
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(d);
      });
      return new Map([...map.entries()].sort((a, b) => a[0].localeCompare(b[0])));
    }
    function drawGrid(svg, margin, plotW, plotH, yMin, yMax, sy) {
      const g = node("g", {class: "grid"});
      for (let i = 0; i <= 5; i++) {
        const y = yMin + (yMax - yMin) * i / 5;
        g.appendChild(node("line", {x1: margin.left, x2: margin.left + plotW, y1: sy(y), y2: sy(y)}));
      }
      svg.appendChild(g);
    }
    function drawAxes(svg, margin, width, height, xMin, xMax, yMin, yMax, sx, sy) {
      const g = node("g", {class: "axis"});
      g.appendChild(node("line", {x1: margin.left, x2: width - margin.right, y1: height - margin.bottom, y2: height - margin.bottom}));
      g.appendChild(node("line", {x1: margin.left, x2: margin.left, y1: margin.top, y2: height - margin.bottom}));
      for (let i = 0; i <= 5; i++) {
        const y = yMin + (yMax - yMin) * i / 5;
        const ty = sy(y);
        g.appendChild(textNode(margin.left - 10, ty + 4, y.toFixed(2), "end"));
      }
      const tickValues = timeTicks(xMin, xMax, width - margin.left - margin.right);
      tickValues.forEach(t => {
        const x = sx(t);
        const label = formatTickLabel(t, xMin, xMax);
        g.appendChild(textNode(x, height - margin.bottom + 24, label, "middle"));
      });
      g.appendChild(textNode(18, height / 2, "Frequency [Hz]", "middle", "rotate(-90 18 " + height / 2 + ")"));
      g.appendChild(textNode(width / 2, height - 12, "Tiempo", "middle"));
      svg.appendChild(g);
    }
    function timeTicks(xMin, xMax, plotW) {
      const agg = els.aggregation.value;
      const span = Math.max(xMax - xMin, 1);
      const maxTicks = Math.min(10, Math.max(2, Math.floor(plotW / 110)));
      if (agg === "hour" && span <= 2 * 86400000) {
        const stepHours = span <= 12 * 3600000 ? 1 : span <= 36 * 3600000 ? 3 : 6;
        const stepMs = stepHours * 3600000;
        const start = new Date(xMin);
        start.setMinutes(0, 0, 0);
        let t = start.getTime();
        while (t < xMin) t += stepMs;
        const ticks = [];
        while (t <= xMax && ticks.length < maxTicks + 2) {
          ticks.push(t);
          t += stepMs;
        }
        return ticks.length >= 2 ? ticks : [xMin, xMax];
      }
      const ticks = Math.min(8, Math.max(2, Math.floor(plotW / 140)));
      return Array.from({length: ticks}, (_, i) => xMin + span * i / Math.max(ticks - 1, 1));
    }
    function formatTickLabel(t, xMin, xMax) {
      const d = displayDate(t);
      const pad = n => String(n).padStart(2, "0");
      const span = xMax - xMin;
      const hhmm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      if (els.aggregation.value === "hour" && span <= 2 * 86400000) return hhmm;
      if (span <= 14 * 86400000) return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hhmm}`;
      if (els.aggregation.value === "month") return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    function seriesColor(name) {
      const match = name.match(/Modo\s+(\d+)/);
      const mode = match ? Number(match[1]) : 1;
      return colors[(mode - 1) % colors.length];
    }
    function seriesDash(name) {
      return name.startsWith("SSI ") ? "6 4" : "";
    }
    function seriesOffset(name) {
      return name.startsWith("SSI ") ? 2.5 : -2.5;
    }
    function seriesMarker(name, x, y, color) {
      if (name.startsWith("SSI ")) {
        const g = node("g", {});
        const size = 4.5;
        g.appendChild(node("line", {x1: x - size, x2: x + size, y1: y - size, y2: y + size, stroke: color, "stroke-width": 2}));
        g.appendChild(node("line", {x1: x - size, x2: x + size, y1: y + size, y2: y - size, stroke: color, "stroke-width": 2}));
        return g;
      }
      return node("circle", {cx: x, cy: y, r: 3.6, fill: color});
    }
    function drawSeries(svg, rows, name, sx, sy) {
      rows.sort((a, b) => a.date - b.date);
      const color = seriesColor(name);
      const maxGap = gapLimitMs();
      let previousTime = null;
      const offset = seriesOffset(name);
      const path = rows.map((d) => {
        const t = d.date.getTime();
        const cmd = previousTime == null || t - previousTime > maxGap ? "M" : "L";
        previousTime = t;
        return `${cmd} ${(sx(t) + offset).toFixed(2)} ${sy(d.frequency_hz).toFixed(2)}`;
      }).join(" ");
      svg.appendChild(node("path", {d: path, fill: "none", stroke: color, "stroke-width": 2, "stroke-dasharray": seriesDash(name)}));
      rows.forEach(d => {
        const x = sx(d.date.getTime()) + offset;
        const y = sy(d.frequency_hz);
        const marker = seriesMarker(name, x, y, color);
        const hit = node("circle", {cx: x, cy: y, r: 8, fill: "transparent"});
        const g = node("g", {});
        g.appendChild(marker);
        g.appendChild(hit);
        g.addEventListener("mousemove", ev => showTooltip(ev, d));
        g.addEventListener("mouseleave", hideTooltip);
        svg.appendChild(g);
      });
    }
    function gapLimitMs() {
      const agg = els.aggregation.value;
      if (agg === "month") return 45 * 86400000;
      if (agg === "day") return 36 * 3600000;
      return 90 * 60000;
    }
    function drawLegend(series) {
      [...series.keys()].forEach((name) => {
        const item = document.createElement("span");
        item.innerHTML = `<i class="swatch" style="background:${seriesColor(name)}"></i>${name}${seriesDash(name) ? " (SSI)" : ""}`;
        els.legend.appendChild(item);
      });
    }
    function showTooltip(ev, d) {
      const count = d.count ? `<br>n: ${d.count}` : "";
      const damping = d.damping_ratio == null ? "" : `<br>Damping: ${Number(d.damping_ratio).toFixed(4)}`;
      const displayTs = formatTimestamp(d.date.getTime());
      const rawTs = displayOffsetMs() ? `<br>Data time: ${d.timestamp}` : "";
      els.tooltip.innerHTML = `${d.method} Modo ${d.mode_index}<br>${displayTs}${rawTs}<br>${d.frequency_hz.toFixed(5)} Hz${damping}${count}`;
      els.tooltip.style.left = `${ev.clientX + 12}px`;
      els.tooltip.style.top = `${ev.clientY + 12}px`;
      els.tooltip.style.display = "block";
    }
    function hideTooltip() {
      els.tooltip.style.display = "none";
    }
    function node(name, attrs) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attrs || {}).forEach(([k, v]) => el.setAttribute(k, v));
      return el;
    }
    function textNode(x, y, text, anchor, transform) {
      const el = node("text", {x, y, "text-anchor": anchor || "start"});
      if (transform) el.setAttribute("transform", transform);
      el.textContent = text;
      return el;
    }
    window.addEventListener("resize", render);
    init();
  </script>
</body>
</html>
